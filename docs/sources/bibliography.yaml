# NeonRadar bibliography: the citation keys for every factual AML statement in the docs.
# How to cite and how to add an entry: docs/sources/README.md. Checked by scripts/check_citations.py.
#
# Fields: key (lowercase snake case with at least one underscore; dated sources end with the
# year where possible), title, publisher, year (null for a living document), url, extra_urls,
# verified (the date someone last opened the url), note (what the source supports, and any
# caveat about how it was verified).
#
# Entries from PHASE-1.md 7.3 were checked by the research note
# docs/research/2026-10-16/aml-domain.md on 15 and 16 October 2026. Milestone M1.10a re-opened
# every url it could on 21 October 2026. fatf-gafi.org, bsaaml.ffiec.gov, eba.europa.eu,
# justice.gov, register.openownership.org and eur-lex.europa.eu answer automated clients with a
# bot challenge, so those entries keep the research note's date (or name the page that was read
# instead) and say so in their note.
version: 1
