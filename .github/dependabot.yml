version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      python-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: "/ui"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
  - package-ecosystem: pre-commit
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    ignore:
      - dependency-name: neo4j     # upgrade by hand (LTS line and GDS pairing)
  - package-ecosystem: devcontainers   # the features in .devcontainer/devcontainer.json
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
