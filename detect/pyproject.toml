[project]
name = "neonradar-detect"
version = "0.1.0"
description = "NeonRadar detection: typology catalog, detectors and the alert writer."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "neo4j>=6.4,<7",
    "neonradar-contracts",
]

[tool.uv.sources]
neonradar-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
