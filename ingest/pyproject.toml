[project]
name = "neonradar-ingest"
version = "0.1.0"
description = "NeonRadar ingestion: source loaders, spikes and the synthetic generator."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "faker>=40.43,<41",
    "neonradar-contracts",
    "numpy>=2.5,<3",
]

[tool.uv.sources]
neonradar-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
