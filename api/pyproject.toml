[project]
name = "neonradar-api"
version = "0.1.0"
description = "NeonRadar API: the FastAPI app that serves contract C3."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn>=0.54,<0.55",
    "neonradar-contracts",
    "neonradar-graph",
    "pydantic-settings>=2.16,<3",
]

[tool.uv.sources]
neonradar-contracts = { workspace = true }
neonradar-graph = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
