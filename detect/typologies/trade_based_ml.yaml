graph_pattern: >
  Not detectable in the C2 graph. Price, quantity and quality misrepresentation can only be
  seen with invoices, shipments and price benchmarks, which C2 does not model. Payment-only
  signals (third-party payments, circular routing, round amounts) are weak.
