# ICIJ `officer_of` link values -> FtM schema (PHASE-2.md M2.5 deliverable 4).
#
# Keys are the `link` value in lower case with runs of spaces collapsed; a value appears once.
# Seeded from the Phase 1 spike's top links (docs/data/spikes/icij.md section 2), the lists in
# docs/research/2026-10-16/sources-opensanctions-ftm-icij.md C.1 and the roles PHASE-2.md M2.5
# names; each role is listed with and without "of". Values not listed become UnknownLink and
# are counted by value in the build summary, so the ingest mentor can extend this table.
#
# ownership: Ownership (owner the officer, asset the entity; `role` the raw link).
# nominee_ownership: the same, with nr.is_nominee true.
# directorship: Directorship (`role` the raw link).
# nominee_directorship: the same, with nr.is_nominee true.
# unknown_link: UnknownLink. Trust and foundation roles (settlor, founder, beneficiary, grantor,
#   protector, trustee) are none of them a holding of shares, and NeonRadar does not guess what
#   control they give; auditors, registers and the like are neither ownership nor directorship.
ownership:
  - shareholder
  - shareholder of
  - owner
  - owner of
  - beneficial owner
  - beneficial owner of
  - ultimate beneficial owner
  - ultimate beneficial owner of
  - ubo
  - partner
  - partner of
nominee_ownership:
  - nominee shareholder
  - nominee shareholder of
directorship:
  - director
  - director of
  - alternate director
  - alternate director of
  - managing director
  - managing director of
  - secretary
  - secretary of
  - president
  - president of
  - vice-president
  - vice-president of
  - treasurer
  - treasurer of
  - chairman
  - chairman of
  - board member
  - board member of
  - officer
  - officer of
  - signatory
  - signatory of
  - is signatory for
  - authorised person / signatory of
  - bank signatory of
  - power of attorney
  - power of attorney of
  - legal representative
  - legal representative of
  - judicial representative
  - judicial representative of
  - liquidator
  - liquidator of
nominee_directorship:
  - nominee director
  - nominee director of
unknown_link:
  - beneficiary
  - beneficiary of
  - settlor
  - settlor of
  - trust settlor of
  - founder
  - founder of
  - grantor
  - grantor of
  - protector
  - protector of
  - trustee
  - trustee of
  - trustee of trust of
  - auditor
  - auditor of
  - records & registers
  - records & registers of
  - custodian
  - custodian of
  - member
  - member of
  - connected to
  - linked to
  - underlying company of
  # OpenSanctions maps these two to Ownership and Directorship (C.1), but neither says shares
  # or a directorship: a PSC may control through votes or appointments only. Mentor to review.
  - person of significant control
  - nominee name of
