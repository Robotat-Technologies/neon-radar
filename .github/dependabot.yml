version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      # numpy and Faker drive the synthetic generator's output (PHASE-3.md 3.1): their
      # upgrades arrive alone, and a numpy bump must pass `neonradar eval check`.
      generator: { patterns: [numpy, faker] }
      python-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: [numpy, faker]
  - package-ecosystem: npm
    directory: "/ui"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      # eslint-plugin-oxlint needs the same oxlint minor as a peer (~x.y.0), so a bump
      # of either one alone fails npm ci: they always arrive in one pull request.
      oxlint: { patterns: [oxlint, eslint-plugin-oxlint] }
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # track Node 24 until the Node-version review after Node 26 LTS
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
  - package-ecosystem: pre-commit
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    ignore:
      - dependency-name: neo4j     # upgrade by hand (LTS line and GDS pairing)
