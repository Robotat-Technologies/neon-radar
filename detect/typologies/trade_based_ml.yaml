false_positives:
  - Ordinary price differences for quality, delivery terms, volume or exchange rates
  - Transfer pricing between companies of one group
  - Payments made by a trade finance or factoring company on a buyer's behalf
  - Goods shipped through a trading hub on their way to the buyer
