[project]
name = "neonradar-workspace"
version = "0.1.0"
description = "NeonRadar uv workspace root (not published)"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = ["neonradar-cli"]

[dependency-groups]
dev = [
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pre-commit>=4.7,<5",
    "types-PyYAML>=6.0,<7",
    "testcontainers[neo4j]>=4.15,<5",
    # FastAPI's TestClient (api/tests); httpx2 is not an encode project, so not used (M1.7d).
    "httpx>=0.28,<0.29",
]

[tool.uv]
package = false
required-version = ">=0.13,<0.14"

[tool.uv.sources]
neonradar-cli = { workspace = true }

[tool.uv.workspace]
members = ["contracts", "keys", "ingest", "graph", "resolve", "detect", "copilot", "api", "cli"]

[tool.ruff]
line-length = 100
target-version = "py314"
# ruff 0.17 also formats code blocks in Markdown. Docs are reviewed by reading, research notes
# are dated evidence, and some blocks show wrong code on purpose (PHASE-1.md 3.2).
extend-exclude = ["*.md"]

# Files run by a system Python (CI's Ubuntu python3 is 3.12, macOS can be 3.9): a 3.14 target
# would let the formatter write syntax that older Pythons reject (PHASE-1.md 3.2).
[tool.ruff.per-file-target-version]
"scripts/*.py" = "py312"
".claude/hooks/*.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.isort]
known-first-party = ["neonradar_*"]

[tool.ruff.lint.per-file-ignores]
# Tests hold names in other scripts on purpose (PHASE-4.md 3.2 trap 18, M4.0).
"**/tests/**" = ["S101", "RUF001"]
"scripts/*" = ["S603", "S607"]
".claude/hooks/*" = ["S603", "S607"]
# Synthetic names in Cyrillic and Arabic script on purpose (PHASE-1.md M1.8e).
"ingest/src/neonradar_ingest/synth/*" = ["RUF001", "RUF003"]
"ingest/tests/test_synth_*" = ["RUF001"]
# Verbatim code book files (PHASE-3.md 2.10) whose imports form one block, as written.
"ingest/tests/test_synth_v1.py" = ["I001"]
"detect/src/neonradar_detect/alerts.py" = ["I001"]
"detect/tests/test_alert_builder.py" = ["I001"]
"detect/tests/test_detector_circular_flow.py" = ["I001"]
"detect/tests/test_graphrows.py" = ["I001"]
"detect/tests/test_evaluation_harness.py" = ["I001"]
"detect/tests/test_evaluation_match.py" = ["I001"]
"detect/tests/test_world_parity.py" = ["I001"]
"cli/src/neonradar_cli/evaluate.py" = ["I001"]
"cli/tests/test_eval_run.py" = ["I001"]
# Arabic and Cyrillic test strings and rules on purpose (PHASE-2.md M2.8).
"keys/**" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = [
    "contracts/src",
    "keys/src",
    "ingest/src",
    "graph/src",
    "resolve/src",
    "detect/src",
    "copilot/src",
    "api/src",
    "cli/src",
]

# PyArrow 26 ships no type information; Splink 5.0, DuckDB 1.5 and sqlglot 30 do (PHASE-2.md
# 3.1, M2.0). Add a block like this only for a module that really has none.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "contract: contract test suite (make contracts-check)",
    "integration: needs Neo4j through Testcontainers (make test-int)",
    "network: uses the internet; never runs in CI",
    "e2e: end-to-end demo test",
]
addopts = "-m 'not integration and not network and not e2e' --strict-markers --import-mode=importlib"
testpaths = [
    "contracts/tests",
    "keys/tests",
    "ingest/tests",
    "graph/tests",
    "resolve/tests",
    "detect/tests",
    "copilot/tests",
    "api/tests",
    "cli/tests",
    "scripts/tests",
]
# scripts: the hygiene scripts; graph/tests/support: the shared Neo4j plugin (conftest.py).
pythonpath = ["scripts", "graph/tests/support"]
filterwarnings = [
    # Starlette 1.9's TestClient asks for httpx2; httpx2 is published from github.com/pydantic,
    # not by encode, so the tests keep httpx 0.28 (M1.7d, decision D13).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
