slug: sanctions_exposure
name: Sanctions exposure through indirect ownership or control
version: 0.1.0
status: draft                 # draft | approved | retired  (only a typology researcher sets approved)
tier: core                    # core | extended | explainer_only
owner: "@robotat-com"         # typology researcher
approved_by: null
summary: >
  A company that is not itself listed is owned or controlled, directly or through a chain of
  other companies, by a person or company that a source lists as sanctioned. The pattern
  describes the structure only; it says nothing about how anyone in it behaved.
doc: docs/typologies/sanctions-exposure.md
citations: [ofac_50_percent_2014, fatf_glossary, fatf_bo_legal_persons_2023, fatf_pf_sanctions_evasion_2025, fatf_egmont_concealment_2018]
graph_pattern: >
  OWNS paths of at most 6 hops from an Entity with the :Sanctioned flag to the subject. For
  each sanctioned owner, the effective share is the sum over its paths of the product of the
  shares along each path, computed once with share_pct_min and once with share_pct_max to give
  a range; it is a teaching metric, not the OFAC test. CONTROLS and DIRECTOR_OF relationships
  on the way create exposure without ownership. One finding, and so one alert, per sanctioned
  owner.
parameters: {}
metrics: []
wording: null
false_positives:
  - A name match that joins a list entry to a different person or company
  - Minority stakes far below any ownership threshold
  - Owners whose listing has ended
  - Listed companies with widely spread shareholding
  - Lawful counterparties owned by a state
synthetic_support: high       # high | medium | low | none
generator_scenario: null
detector: null
