name: neonradar-d7

services:
  plugins:
    image: neonradar-d7-dev
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspaces/neonradar
    volumes:
      - ..:/workspaces/neonradar
    command: ["bash", "scripts/fetch_gds.sh"]
    restart: "no"

  neo4j:
    image: neo4j:5.26.32-community

    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Missing NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError"
      NEO4J_client_allow__telemetry: "false"
      NEO4J_dbms_usage__report_enabled: "false"
    entrypoint:
      - tini
      - -g
      - --
      - sh
      - -ec
      - |
        cp /nr-plugins/neo4j-graph-data-science-2.13.4.jar /var/lib/neo4j/plugins/
        exec /startup/docker-entrypoint.sh neo4j
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ../data/cache/neo4j-plugins:/nr-plugins:ro
    mem_limit: 2500m
    depends_on:
      plugins:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1" || exit 1'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  dev:
    image: neonradar-d7-dev
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspaces/neonradar
    command: ["sleep", "infinity"]
    environment:
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Missing NEO4J_PASSWORD}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NR_TEST_NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ..:/workspaces/neonradar
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
