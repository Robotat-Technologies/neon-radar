# The end-to-end test (PHASE-1.md M1.9e): `make demo-mini`, then Playwright against it. Not a
# required check. On pull requests it runs only when the pull request has the `e2e` label.
name: e2e
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-mini:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ICU headers for PyICU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libicu-dev
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --all-packages --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npx --prefix ui playwright install --with-deps chromium
      # Creates .env with a generated password, fetches the pinned GDS jar (SHA-256 checked),
      # builds the API and UI images and prints the URLs and the time.
      - run: make demo-mini
      - run: make e2e
      - name: Container logs
        if: ${{ failure() }}
        run: docker compose --profile app logs --no-color --tail=300
      - name: Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
