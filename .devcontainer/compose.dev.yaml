# Used together with ../compose.yaml. With several Compose files, relative paths resolve
# from the folder of the first file (the repository root), not from this folder.
services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspaces/neonradar:cached
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NR_TEST_NEO4J_URI: bolt://neo4j:7687
      # The same value Compose gives Neo4j (from .env or the environment), so the tools inside
      # always match the database, also when .env is a link the container cannot follow.
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      # `neonradar doctor` reports the missing Docker as a warning here (no Docker by design).
      NR_DEVCONTAINER: "1"
    depends_on:
      neo4j:
        condition: service_healthy
