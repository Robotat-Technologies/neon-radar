# Paths resolve from the repository root, where compose.yaml lives.
services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspaces/neonradar
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspaces/neonradar:cached
      - "${NR_DEV_GIT_COMMON_DIR:-./.git}:/workspaces/neonradar-git"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NR_TEST_NEO4J_URI: bolt://neo4j:7687
      GIT_DIR: "${NR_DEV_GIT_DIR:-/workspaces/neonradar/.git}"
      GIT_WORK_TREE: /workspaces/neonradar
      UV_HTTP_TIMEOUT: "300"
      UV_CONCURRENT_DOWNLOADS: "2"
    depends_on:
      neo4j:
        condition: service_healthy
