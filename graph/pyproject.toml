[project]
name = "neonradar-graph"
version = "0.1.0"
description = "NeonRadar graph: Neo4j client, schema migrations and the record loader."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "followthemoney>=4.11,<5",
    "neo4j>=6.4,<7",
    "neonradar-contracts",
    "neonradar-keys",
    "pydantic-settings>=2.16,<3",
]

# Test-only (PHASE-2.md M2.11): the integration tests build resolution runs with the resolver.
# The package code never imports it, so the API image stays free of PyArrow, DuckDB and Splink.
[dependency-groups]
dev = ["neonradar-resolve"]

[tool.uv.sources]
neonradar-contracts = { workspace = true }
neonradar-keys = { workspace = true }
neonradar-resolve = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
