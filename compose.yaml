name: neonradar

services:
  neo4j:
    image: neo4j:5.26.32-community
    # Build NEO4J_AUTH from the neo4j_password secret (below), so the password never appears in
    # the container's configuration, in `docker inspect` or in printed Compose configurations.
    # Then copy the pinned GDS jar (mounted read-only at /nr-plugins) into the plugins folder and
    # run the image's own entrypoint. The entrypoint chowns NEO4J_HOME and /plugins, so the jar
    # is mounted outside both and the host folder is never written.
    entrypoint:
      - tini
      - -g
      - --
      - sh
      - -c
      - |
        p="$$(cat /run/secrets/neo4j_password 2>/dev/null || true)"
        if [ "$${#p}" -lt 8 ]; then
          echo "neonradar: NEO4J_PASSWORD is missing or shorter than 8 characters; set it in .env" >&2
          exit 1
        fi
        export NEO4J_AUTH="neo4j/$$p"
        unset p
        cp /nr-plugins/neo4j-graph-data-science-2.13.4.jar /var/lib/neo4j/plugins/
        exec /startup/docker-entrypoint.sh "$$@"
      - neonradar-entrypoint
    command: ["neo4j"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    secrets: [neo4j_password]
    environment:
      # APOC Core is installed from the image's labs/ folder. The Community image has no GDS jar
      # and "graph-data-science" here would download one on every start, so `make plugins`
      # fetches a pinned jar once instead; nothing is downloaded when the container starts.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-2G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError"
      # No product analytics from Browser and no usage reports from the server. Source: Neo4j 5
      # Operations Manual, configuration settings (client.allow_telemetry,
      # dbms.usage_report.enabled): https://neo4j.com/docs/operations-manual/5/configuration/configuration-settings/
      NEO4J_client_allow__telemetry: "false"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/import:/import:ro
      # Written by `make plugins` (scripts/fetch_gds.sh pins the version and the SHA-256).
      - type: bind
        source: ./data/cache/neo4j-plugins
        target: /nr-plugins
        read_only: true
        bind:
          create_host_path: false
    mem_limit: "${NEO4J_MEM_LIMIT:-5g}"
    healthcheck:
      # cypher-shell reads NEO4J_PASSWORD, so the password stays out of the process list.
      test: ["CMD-SHELL", "NEO4J_PASSWORD=\"$$(cat /run/secrets/neo4j_password)\" cypher-shell -u neo4j 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

secrets:
  # NEO4J_PASSWORD from the environment or, through Compose's usual lookup, from .env. Compose
  # hands it to the containers as the file /run/secrets/neo4j_password.
  neo4j_password:
    environment: NEO4J_PASSWORD

volumes:
  neo4j_data:
  neo4j_logs:
