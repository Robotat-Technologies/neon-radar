[project]
name = "neonradar-ingest"
version = "0.1.0"
description = "NeonRadar ingestion: source loaders, spikes and the synthetic generator."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "faker>=40.43,<41",
    "followthemoney>=4.11,<5",
    "httpx>=0.28,<0.29",
    "neonradar-contracts",
    "neonradar-keys",
    "numpy>=2.5,<3",
    "orjson==3.13.*",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6,<7",
]

[tool.uv.sources]
neonradar-contracts = { workspace = true }
neonradar-keys = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
