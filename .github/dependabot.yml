version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      # numpy and Faker drive the synthetic generator's output (PHASE-3.md 3.1): their
      # upgrades arrive alone, and a numpy bump must pass `neonradar eval check`.
      generator: { patterns: [numpy, faker] }
      python-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: [numpy, faker]
  - package-ecosystem: npm
    directory: "/ui"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
  - package-ecosystem: pre-commit
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    ignore:
      - dependency-name: neo4j     # upgrade by hand (LTS line and GDS pairing)
