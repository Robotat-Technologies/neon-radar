summary: >
  Funds move quickly through a sequence of accounts held by different companies or people,
  often across jurisdictions, which puts distance between the money and where it came from.
doc: docs/typologies/layering-chain.md
citations: [fatf_faq, fatf_pml_2018, fatf_egmont_concealment_2018, fincen_fin_2006_g014, europol_efecta_2023, wolfsberg_payment_transparency_2023, ffiec_appendix_f]
graph_pattern: >
  A time-ordered path of three or more PAID hops through Accounts held by different
  LegalEntity nodes, with short dwell times, amounts shrinking slightly at each hop or split
  and merged again, and intermediate holders with little other activity, often sharing a
  registered address, an agent or a director.
