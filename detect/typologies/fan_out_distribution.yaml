slug: fan_out_distribution
name: Fan-out distribution from one account
version: 0.1.0
status: draft                 # draft | approved | retired  (only a typology researcher sets approved)
tier: core                    # core | extended | explainer_only
owner: "@robotat-com"         # typology researcher
approved_by: null
summary: >
  One account sends funds to multiple recipient accounts, potentially within a short
  window. Some recipients may then withdraw the funds or transfer them onward.
  Ordinary batch payments can produce a similar shape.
doc: docs/typologies/fan-out-distribution.md
citations:
  - fincen_fin_2006_g014
  - ffiec_appendix_f
  - fatf_pml_2018
  - fatf_cyber_fraud_2023
  - fincen_fin_2025_a003
  - europol_money_muling
graph_pattern: >
  One Account with outgoing PAID relationships to multiple distinct Accounts,
  potentially within a short window. Candidate supporting features include similar
  or round amounts, limited earlier payment history with recipients, and subsequent
  cash withdrawals (PAID with channel cash_withdrawal to a cash_ledger Account)
  or onward PAID transfers. These features are optional detection heuristics.
  The pattern can follow a fan-in to the same Account.
parameters: {}
metrics: []
wording: null
false_positives:
  - Payroll runs
  - Supplier payment batches
  - Dividend and interest distributions
  - Government benefit payments
  - Insurance claim payouts
  - Marketplace and gig-platform payouts to sellers and workers
  - Refunds after a cancelled event
synthetic_support: high       # high | medium | low | none
generator_scenario: null
