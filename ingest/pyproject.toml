[project]
name = "neonradar-ingest"
version = "0.1.0"
description = "NeonRadar ingestion: source loaders, spikes and the synthetic generator."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "followthemoney>=4.11,<5",
    "httpx>=0.28,<0.29",
    "neonradar-contracts",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6,<7",
]

[tool.uv.sources]
neonradar-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
