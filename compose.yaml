name: neonradar

services:
  neo4j:
    image: neo4j:5.26.32-community
    # Copy the pinned GDS jar (mounted read-only at /nr-plugins, below) into the plugins folder,
    # then run the image's own entrypoint. The entrypoint chowns NEO4J_HOME and /plugins, so the
    # jar is mounted outside both and the host folder is never written.
    entrypoint:
      - tini
      - -g
      - --
      - sh
      - -c
      - cp /nr-plugins/neo4j-graph-data-science-2.13.4.jar /var/lib/neo4j/plugins/ && exec /startup/docker-entrypoint.sh "$$@"
      - neonradar-entrypoint
    command: ["neo4j"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (at least 8 characters)}"
      # APOC Core is installed from the image's labs/ folder. The Community image has no GDS jar
      # and "graph-data-science" here would download one on every start, so `make plugins`
      # fetches a pinned jar once instead; nothing is downloaded when the container starts.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-2G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError"
      # No product analytics from Browser and no usage reports from the server. Source: Neo4j 5
      # Operations Manual, configuration settings (client.allow_telemetry,
      # dbms.usage_report.enabled): https://neo4j.com/docs/operations-manual/5/configuration/configuration-settings/
      NEO4J_client_allow__telemetry: "false"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/import:/import:ro
      # Written by `make plugins` (scripts/fetch_gds.sh pins the version and the SHA-256).
      - type: bind
        source: ./data/cache/neo4j-plugins
        target: /nr-plugins
        read_only: true
        bind:
          create_host_path: false
    mem_limit: "${NEO4J_MEM_LIMIT:-5g}"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  # The demo (`make demo-mini`): API and UI images built from this repository, started only with
  # the "app" profile, so `make up` still starts Neo4j alone. Both publish on 127.0.0.1 only.
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (at least 8 characters)}"
    ports:
      - "127.0.0.1:${NR_API_PORT:-8000}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Healthy once the API answers and reports Neo4j, APOC and GDS ("ok"); no curl in the image.
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request as u; r = u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4); raise SystemExit(json.load(r)['status'] != 'ok')"
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 10s

  ui:
    profiles: [app]
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NR_UI_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
        # nginx resolves the api container once at start; restart it when api is recreated.
        restart: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The real-data instance (PHASE-2.md 4.1, C2 L17, M2.0). Real profiles load only here, never
  # into neo4j above, which the API, the UI, the tests and the agent use. Its only database is
  # realdata, so a query sent to the wrong instance fails. Same image, plugins, memory settings
  # and healthcheck as neo4j. Started only with the profile: `make up-real` on an approved
  # machine (docs/data/real-data-machines.md). Its store and its logs (which can hold query
  # text) live in two named volumes; `neonradar data purge --graph` removes the container,
  # then both volumes (M2.2). `make reset` never touches them.
  neo4j-real:
    profiles: [real]
    image: neo4j:5.26.32-community
    entrypoint:
      - tini
      - -g
      - --
      - sh
      - -c
      - cp /nr-plugins/neo4j-graph-data-science-2.13.4.jar /var/lib/neo4j/plugins/ && exec /startup/docker-entrypoint.sh "$$@"
      - neonradar-entrypoint
    command: ["neo4j"]
    # Not restarted with Docker: real data is served only while someone works with it.
    restart: "no"
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      # Empty unless set: no :? guard, because Compose checks every service, so a guard here
      # would stop `make up` on machines without real data. `make up-real` checks it instead.
      NEO4J_AUTH: "neo4j/${NEO4J_REAL_PASSWORD:-}"
      NEO4J_initial_dbms_default__database: realdata
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-2G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError"
      NEO4J_client_allow__telemetry: "false"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-real-data:/data
      - neo4j-real-logs:/logs
      - type: bind
        source: ./data/cache/neo4j-plugins
        target: /nr-plugins
        read_only: true
        bind:
          create_host_path: false
    mem_limit: "${NEO4J_MEM_LIMIT:-5g}"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j-real-data:
  neo4j-real-logs:
