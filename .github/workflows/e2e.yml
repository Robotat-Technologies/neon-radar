# The end-to-end test (PHASE-1.md M1.9e): `make demo-mini`, then Playwright against it. Not a
# required check. On pull requests it runs only when the pull request has the `e2e` label.
name: e2e
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-mini:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ICU headers for PyICU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libicu-dev
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --all-packages --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # No dependency needs an install script on Linux; Playwright's browser is installed next.
      - run: npm ci --ignore-scripts --prefix ui
      - run: npx --prefix ui playwright install --with-deps chromium
      # The GDS jar that scripts/fetch_gds.sh pins (OD-13), cached under its SHA-256 as in ci.yml;
      # make demo-mini downloads it only on a cache miss and always checks the SHA-256.
      - name: GDS jar pin
        id: gds
        run: |
          sha="$(sed -n 's/^GDS_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' scripts/fetch_gds.sh)"
          test -n "$sha" || { echo "scripts/fetch_gds.sh does not pin GDS_SHA256" >&2; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: data/cache/neo4j-plugins
          key: neo4j-gds-${{ steps.gds.outputs.sha256 }}
      # Creates .env with a generated password, builds the API and UI images and prints the URLs
      # and the time.
      - run: make demo-mini
      - run: make e2e
      - run: make load PROFILE=demo
      - run: uv run neonradar graph verify
      - name: Container logs
        if: ${{ failure() }}
        run: docker compose --profile app logs --no-color --tail=300
      - name: Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
