name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ICU headers for PyICU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libicu-dev
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --all-packages --locked
      - name: Cache pre-commit hook environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files
        env:
          # The gitleaks hook scans staged changes only, so nothing in CI; the hygiene job
          # scans the pull request's commits instead.
          SKIP: gitleaks
      - run: make lint typecheck test contracts-check
      - name: Citation keys
        run: uv run python scripts/check_citations.py docs/ detect/typologies/ README.md
      - name: Agent hook self-test
        run: bash scripts/test_hooks.sh
      - name: CODEOWNERS up to date
        run: uv run --no-project --with pyyaml python scripts/generate_codeowners.py --check
      - name: Typology index up to date
        run: uv run neonradar docs typology-index --check

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ICU headers for PyICU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libicu-dev
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --all-packages --locked
      # The GDS jar that scripts/fetch_gds.sh pins (OD-13), cached under its SHA-256; the
      # fetch downloads it only on a cache miss and always checks the SHA-256.
      - name: GDS jar pin
        id: gds
        run: |
          sha="$(sed -n 's/^GDS_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' scripts/fetch_gds.sh)"
          test -n "$sha" || { echo "scripts/fetch_gds.sh does not pin GDS_SHA256" >&2; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: data/cache/neo4j-plugins
          key: neo4j-gds-${{ steps.gds.outputs.sha256 }}
      - name: GDS jar
        run: bash scripts/fetch_gds.sh
      - run: uv run pytest -m "integration and not network"
        env:
          NR_NEO4J_IMAGE: neo4j:5.26.32-community

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node for the UI and for the Cypher lint (PHASE-2.md M2.0), which runs in this job.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            scripts/cypher-lint/package-lock.json
      - name: Cypher lint
        run: make cypher-lint
      # No dependency needs an install script on Linux (only fsevents, for macOS).
      - if: ${{ hashFiles('ui/package.json') != '' }}
        run: npm ci --ignore-scripts --prefix ui
      - name: API types match the OpenAPI snapshot
        if: ${{ hashFiles('ui/package.json') != '' }}
        run: npm run --prefix ui gen:api && git diff --exit-code ui/src/api/schema.d.ts
      - if: ${{ hashFiles('ui/package.json') != '' }}
        run: npm run --prefix ui lint && npm run --prefix ui type-check && npm run --prefix ui test:unit -- --run && npm run --prefix ui build
