[project]
name = "neonradar-contracts"
version = "0.1.0"
description = "NeonRadar contracts: C1 record, C2 graph schema, C3 API and C4 alert."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    # a minor release of pydantic can change the OpenAPI snapshot (PHASE-4.md 3.1, 3.5 item 5)
    "pydantic>=2.14,<2.15",
    "followthemoney>=4.11,<5",
    "pyyaml>=6,<7",
    "babel>=2.16,<3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
