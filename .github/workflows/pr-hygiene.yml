name: pr-hygiene
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
      BASE_REF: refs/remotes/origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional title
        run: python3 scripts/check_pr_title.py "$PR_TITLE"
      - name: Size limit
        run: python3 scripts/check_pr_size.py --base "$BASE_REF" --labels "$PR_LABELS"
      - name: Frozen contract paths
        run: python3 scripts/check_contract_paths.py --base "$BASE_REF" --labels "$PR_LABELS"
      - name: Synthetic fixtures only
        run: python3 scripts/check_fixtures.py
      - name: Wording lint
        run: python3 scripts/check_wording.py
      - name: Secrets in this pull request's commits
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          base="$(git rev-parse --verify "${BASE_REF}^{commit}")"
          count="$(git rev-list --count "${base}..HEAD")"
          if [ "$count" -eq 0 ]; then
            echo "::error::no commits to scan in ${BASE_REF}..HEAD"
            exit 1
          fi
          echo "Scanning ${count} commits in ${BASE_REF}..HEAD"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="${base}..HEAD" .
