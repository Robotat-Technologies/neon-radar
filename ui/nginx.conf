# nginx for the NeonRadar UI image (ui/Dockerfile): serves the built UI with history fallback to
# index.html and forwards /api/ to the API container. Runs as the unprivileged nginx user, so the
# pid file and temporary files live in /tmp and it listens on 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    # Redirects keep the address the browser used (Compose publishes 8080 on another host port).
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Any other Host header (for example a DNS rebinding attempt) gets no answer at all.
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8080;
        # Matched without the port, so it holds whichever host port Compose publishes.
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;

        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # The API (contract C3) under its own path, unchanged: /api/v1/... on api:8000.
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vite writes content-hashed file names here.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        # Client-side routes (/alerts, /entities/...) all load index.html.
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
