# ingest/profiles/demo.yaml
profile: demo
description: Synthetic data only. The Phase 1 demo-mini fixture and the entity resolution benchmark (M2.9).
real_data: false
sources:
  nr_synthetic:
    enabled: true
    fixtures: [data/fixtures/demo-mini, data/fixtures/er-bench]
resolution:
  enabled: true
  config: resolve/config/er.yaml
# Phase 3 blocks (PHASE-3.md 7.11, M3.4; the data steward approves them in review)
overlay:
  enabled: false        # demo-mini carries its own payments; synth-demo is the overlay demo
detection:
  enabled: true
  window: data          # the PAID time range of the loaded records
  overrides:
    mass_registration_address: { top_share: 0.0 }
